name: Debug Detail Page Fields (one-off diagnostic)

# One-off diagnostic to inspect the REAL field/param names mudah's listing
# detail pages use for Furnishing (and re-confirm Bedrooms/Bathrooms), since
# Furnishing has been 100% blank across every scrape despite the
# --fetch-details enrichment pass visiting the detail page directly. Dumps
# the raw __NEXT_DATA__ JSON for a few real detail pages as an artifact so
# the actual structure can be inspected instead of guessed at - same
# discipline as the debug dumps already used elsewhere in this pipeline.
#
# Safe to delete once the Furnishing extraction bug is found and fixed - this
# does not touch the Google Sheet or any data branch.

on:
  workflow_dispatch:
    inputs:
      detail_limit:
        description: "How many listings to dump detail pages for"
        required: false
        default: "5"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: pip install curl_cffi pandas openpyxl gspread google-auth

      - name: Run scraper with debug-dump (no Google Sheet write)
        working-directory: scripts/listings-pipeline
        env:
          DETAIL_LIMIT: ${{ github.event.inputs.detail_limit || '5' }}
        run: |
          python scrape_penang_owners.py \
            --statewide \
            --pages 1 \
            --fetch-details \
            --detail-limit "$DETAIL_LIMIT" \
            --debug-dump \
            --output penang_owners_debug.xlsx \
            --seen-file /tmp/penang_seen_listings_debug.json \
            --no-dedup-tracking

      - name: Grep dumped JSON for furnishing/bedroom/bathroom keys (prints straight to job log)
        working-directory: scripts/listings-pipeline
        run: |
          python3 - <<'PY'
          import json, re, glob

          def walk(obj, path=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = f"{path}.{k}" if path else str(k)
                      if re.search(r"furnish|bedroom|bathroom|room|bath", str(k), re.I):
                          preview = v if not isinstance(v, (dict, list)) else type(v).__name__
                          print(f"MATCH  {p} = {preview!r}")
                      walk(v, p)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj[:50]):
                      walk(v, f"{path}[{i}]")

          def key_tree(obj, depth=0, max_depth=4):
              if depth > max_depth:
                  return
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      kind = type(v).__name__
                      extra = ""
                      if isinstance(v, list):
                          extra = f" (len={len(v)})"
                      print("  " * depth + f"{k}: {kind}{extra}")
                      key_tree(v, depth + 1, max_depth)
              elif isinstance(obj, list) and obj:
                  key_tree(obj[0], depth, max_depth)

          for fname in sorted(glob.glob("debug_detail_page.json")) + sorted(glob.glob("debug_*_first_ad.json")):
              print(f"\n===== {fname} =====")
              try:
                  with open(fname) as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"  (failed to load: {e})")
                  continue
              walk(data)
              if fname == "debug_detail_page.json":
                  print(f"\n----- key tree for {fname} (depth 4) -----")
                  key_tree(data)

          print("\n\n===== simulating find_ad_node + field_value on debug_detail_page.json =====")
          import sys
          sys.path.insert(0, ".")
          from scrape_penang_owners import find_ad_node, field_value, extract_category_params, DETAIL_FILL_COLUMNS

          with open("debug_detail_page.json") as f:
              nd = json.load(f)

          # list_id came from the URL in the "[details] 1/5" log line - the
          # first --detail-limit target this run. Try every id under
          # adDetails.byID as a fallback in case the URL-derived id format
          # doesn't match what's stored.
          candidate_ids = list(
              (nd.get("props", {}).get("initialState", {}).get("adDetails", {}).get("byID", {}) or {}).keys()
          )
          print(f"candidate ad ids in adDetails.byID: {candidate_ids}")

          for list_id in candidate_ids:
              node = find_ad_node(nd, list_id)
              print(f"\n--- list_id={list_id} ---")
              if node is None:
                  print("  find_ad_node returned None")
                  continue
              print(f"  node top-level keys: {list(node.keys()) if isinstance(node, dict) else type(node)}")
              attrs = node.get("attributes", node) if isinstance(node, dict) else node
              print(f"  attrs top-level keys: {list(attrs.keys()) if isinstance(attrs, dict) else type(attrs)}")
              params = extract_category_params(attrs)
              print(f"  extracted params dict: {params}")
              for col, key in DETAIL_FILL_COLUMNS.items():
                  val = field_value(attrs, key, params)
                  print(f"  {col} ({key}) = {val!r}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: debug-detail-fields
          path: |
            scripts/listings-pipeline/debug_detail_page.json
            scripts/listings-pipeline/debug_detail_page.html
            scripts/listings-pipeline/debug_detail_page_raw.json
            scripts/listings-pipeline/debug_*_first_ad.json
          retention-days: 3
          if-no-files-found: warn
