name: Subsales Listing Builder

# Text-only Subsales listing pipeline for penangproperty.com.my - mudah's
# photos are too low-res/watermarked to publish, so this skips photos
# entirely: builds a freshly composed title + key stats + a WhatsApp inquiry
# link (pre-filled with a stable internal ref number) per qualifying mudah
# listing, and pushes the result into the "Subsales Queue" tab of the live
# Google Sheet for review before publishing to the site.
#
# Site-side auto-publish (actually creating the post on penangproperty.com.my)
# is NOT wired up yet - that needs the site's platform/API confirmed first.
# Until then this just keeps the queue up to date for manual publishing.

on:
  workflow_dispatch:
    inputs:
      new_only:
        description: "Only 'Is New Today' listings"
        required: false
        default: "false"
      limit:
        description: "Max qualifying listings to process (0 = all)"
        required: false
        default: "0"
  # Run shortly after the daily scrape (which runs at 00:00 UTC).
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: pip install pandas openpyxl gspread google-auth

      - name: Restore latest scrape from data branch
        working-directory: scripts/listings-pipeline
        run: |
          git fetch origin data/penang-owners-scrape
          git show origin/data/penang-owners-scrape:scripts/listings-pipeline/penang_owners.xlsx \
            > penang_owners.xlsx

      - name: Restore ref-number registry from data branch
        working-directory: scripts/listings-pipeline
        run: |
          git fetch origin data/subsales-registry || true
          git show origin/data/subsales-registry:scripts/listings-pipeline/subsales_registry.json \
            > subsales_registry.json 2>/dev/null || echo "{}" > subsales_registry.json

      - name: Write Google service-account key from secret
        working-directory: scripts/listings-pipeline
        run: echo '${{ secrets.GSHEET_SERVICE_ACCOUNT_JSON }}' > gsheet_key.json

      - name: Build Subsales queue
        working-directory: scripts/listings-pipeline
        env:
          NEW_ONLY: ${{ github.event.inputs.new_only || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          NEW_FLAG=""
          if [ "$NEW_ONLY" = "true" ]; then NEW_FLAG="--new-only"; fi
          python subsales_listing_builder.py \
            --input penang_owners.xlsx \
            --registry subsales_registry.json \
            --limit "$LIMIT" \
            --gsheet-id "1MVjmW28PuJruSwbt-JUrY9f51dPMC-O6lDDLfOwOpRI" \
            --gsheet-key gsheet_key.json \
            --tab "Subsales Queue" \
            $NEW_FLAG

      - name: Remove service-account key
        if: always()
        working-directory: scripts/listings-pipeline
        run: rm -f gsheet_key.json

      - name: Commit ref-number registry back to data branch
        working-directory: scripts/listings-pipeline
        run: |
          cp subsales_registry.json /tmp/subsales_registry.json
          rm -f subsales_registry.json penang_owners.xlsx
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin data/subsales-registry; then
            git checkout -B data/subsales-registry FETCH_HEAD
          else
            git checkout --orphan data/subsales-registry
            git read-tree --empty
          fi
          cp /tmp/subsales_registry.json subsales_registry.json
          git add -f subsales_registry.json
          if git diff --cached --quiet; then
            echo "Registry unchanged since last run - nothing to commit."
          else
            git commit -m "Subsales ref registry ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin data/subsales-registry
          fi
