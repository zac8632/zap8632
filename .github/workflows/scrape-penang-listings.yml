name: Scrape Penang Listings

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Mudah.my search URL"
        required: false
        default: "https://www.mudah.my/malaysia/properties-for-sale?adsby=false&subarea=117%2C116%2C102%2C99%2C88"
      max_pages:
        description: "Max pages to crawl"
        required: false
        default: "20"
      fetch_contacts:
        description: "Also visit each listing page and try to extract seller contact info"
        required: false
        default: "false"
      contact_limit:
        description: "Max number of listings to fetch contacts for (0 = all)"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/mudah-penang-scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scripts/mudah-penang-scraper
        run: |
          python scraper.py \
            --url "${{ github.event.inputs.url }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --output penang_listings.xlsx

      - name: Fetch seller contacts
        if: ${{ github.event.inputs.fetch_contacts == 'true' }}
        working-directory: scripts/mudah-penang-scraper
        run: |
          python fetch_contacts.py \
            --input penang_listings.xlsx \
            --output penang_listings.xlsx \
            --limit "${{ github.event.inputs.contact_limit }}"

      - uses: actions/upload-artifact@v4
        with:
          name: penang-listings
          path: scripts/mudah-penang-scraper/penang_listings.xlsx
          retention-days: 14

      - name: Commit results to data branch
        working-directory: scripts/mudah-penang-scraper
        run: |
          cp penang_listings.xlsx /tmp/penang_listings.xlsx
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data/penang-listings || true
          git checkout data/penang-listings 2>/dev/null || git checkout -b data/penang-listings
          cp /tmp/penang_listings.xlsx penang_listings.xlsx
          git add -f penang_listings.xlsx
          git commit -m "Scrape results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin data/penang-listings
