name: Scrape Penang Listings

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Mudah.my search URL"
        required: false
        default: "https://www.mudah.my/malaysia/properties-for-sale?adsby=false&subarea=117%2C116%2C102%2C99%2C88"
      max_pages:
        description: "Max pages to crawl"
        required: false
        default: "20"
      owner_only:
        description: "Switch to the 'By Owner' filter tab (exclude agent listings)"
        required: false
        default: "false"
      fetch_contacts:
        description: "Also visit each listing page and try to extract seller contact info"
        required: false
        default: "false"
      contact_limit:
        description: "Max number of listings to fetch contacts for (0 = all)"
        required: false
        default: "5"
      debug_url:
        description: "If set, runs debug_detail_page.py against this URL and skips everything else"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Debug detail page (log output only)
        if: ${{ github.event.inputs.debug_url != '' }}
        working-directory: scripts/listings-pipeline
        run: |
          python debug_detail_page.py "${{ github.event.inputs.debug_url }}"

      - name: Run scraper
        if: ${{ github.event.inputs.debug_url == '' }}
        working-directory: scripts/listings-pipeline
        run: |
          OWNER_FLAG=""
          if [ "${{ github.event.inputs.owner_only }}" = "true" ]; then OWNER_FLAG="--owner-only"; fi
          python scraper.py \
            --url "${{ github.event.inputs.url }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --output penang_listings.xlsx \
            $OWNER_FLAG

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.debug_url == '' }}
        with:
          name: penang-listings
          path: scripts/listings-pipeline/penang_listings.xlsx
          retention-days: 14

      - name: Commit results to data branch
        if: ${{ github.event.inputs.debug_url == '' }}
        working-directory: scripts/listings-pipeline
        run: |
          cp penang_listings.xlsx /tmp/penang_listings.xlsx
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data/penang-listings || true
          git checkout data/penang-listings 2>/dev/null || git checkout -b data/penang-listings
          cp /tmp/penang_listings.xlsx penang_listings.xlsx
          git add -f penang_listings.xlsx
          git commit -m "Scrape results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin data/penang-listings
          # Switch back so later steps see the scripts as they are on
          # main (data/penang-listings never gets script updates rebased
          # onto it, it only ever accumulates xlsx commits).
          git checkout main
          cp /tmp/penang_listings.xlsx penang_listings.xlsx

      # Seller contact info (name/phone) is personal data about third
      # parties, so it is deliberately NEVER written to a committed file
      # or uploaded artifact - only printed to this step's own log
      # output, which the caller reads directly and discards.
      - name: Fetch seller contacts (log output only, not persisted)
        if: ${{ github.event.inputs.fetch_contacts == 'true' && github.event.inputs.debug_url == '' }}
        working-directory: scripts/listings-pipeline
        run: |
          python fetch_contacts.py \
            --input penang_listings.xlsx \
            --output /tmp/contacts_local_only.xlsx \
            --limit "${{ github.event.inputs.contact_limit }}"
