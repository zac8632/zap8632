name: Daily Data Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Max pages to crawl per category"
        required: false
        default: "200"
      statewide:
        description: "Scrape all of Penang state (not just the island)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: pip install -r requirements.txt

      - name: Restore seen-listings registry from data branch
        working-directory: scripts/listings-pipeline
        run: |
          git fetch origin data/penang-owners-scrape || true
          # git show <rev>:<path> resolves <path> relative to the REPO ROOT,
          # not this step's working-directory - the committed file actually
          # lives at scripts/listings-pipeline/penang_seen_listings.json, so
          # the old bare "penang_seen_listings.json" path here was silently
          # failing on every single run (falling back to "{}"), meaning the
          # dedup registry never actually persisted across days - every
          # listing showed as "new" every run since this workflow was
          # created. Confirmed live: every entry in the committed file had
          # today's date, none carried over from prior days.
          git show origin/data/penang-owners-scrape:scripts/listings-pipeline/penang_seen_listings.json \
            > penang_seen_listings.json 2>/dev/null || echo "{}" > penang_seen_listings.json

      - name: Restore listing archive + hero images from data branch
        # No working-directory override here (unlike the sibling steps) -
        # deliberately runs from the repo root so this pathspec-based git
        # archive call and the git-show call are both unambiguously
        # repo-root-relative. Mixing a working-directory: subfolder with a
        # full repo-root-relative pathspec is exactly the kind of path
        # confusion that silently broke the seen-listings restore step
        # above (see its comment) - not worth risking again for a whole
        # directory of images.
        run: |
          git show origin/data/penang-owners-scrape:scripts/listings-pipeline/penang_archive.json \
            > scripts/listings-pipeline/penang_archive.json 2>/dev/null \
            || echo "{}" > scripts/listings-pipeline/penang_archive.json
          mkdir -p scripts/listings-pipeline/archive_images
          git archive origin/data/penang-owners-scrape -- scripts/listings-pipeline/archive_images 2>/dev/null \
            | tar -x || true

      - name: Write Google service-account key from secret
        working-directory: scripts/listings-pipeline
        run: echo '${{ secrets.GSHEET_SERVICE_ACCOUNT_JSON }}' > gsheet_key.json

      - name: Run scraper
        working-directory: scripts/listings-pipeline
        env:
          PAGES: ${{ github.event.inputs.pages || '200' }}
          STATEWIDE: ${{ github.event.inputs.statewide || 'true' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATEWIDE_FLAG=""
          if [ "$STATEWIDE" = "true" ]; then STATEWIDE_FLAG="--statewide"; fi
          python scrape_penang_owners.py \
            $STATEWIDE_FLAG \
            --pages "$PAGES" \
            --fetch-details \
            --detail-limit 200 \
            --output penang_owners.xlsx \
            --seen-file penang_seen_listings.json \
            --gsheet-id "1MVjmW28PuJruSwbt-JUrY9f51dPMC-O6lDDLfOwOpRI" \
            --gsheet-key gsheet_key.json

      - name: Update listing archive (incl. expired-listing tracking + hero images)
        working-directory: scripts/listings-pipeline
        run: |
          python archive_listings.py \
            --scrape-output penang_owners.xlsx \
            --archive-file penang_archive.json \
            --images-dir archive_images \
            --gsheet-id "1MVjmW28PuJruSwbt-JUrY9f51dPMC-O6lDDLfOwOpRI" \
            --gsheet-key gsheet_key.json

      - name: Remove service-account key before committing
        working-directory: scripts/listings-pipeline
        run: rm -f gsheet_key.json

      - uses: actions/upload-artifact@v4
        with:
          name: penang-owners-listings
          path: scripts/listings-pipeline/penang_owners.xlsx
          retention-days: 14

      - name: Commit results to data branch
        working-directory: scripts/listings-pipeline
        run: |
          cp penang_owners.xlsx /tmp/penang_owners.xlsx
          cp penang_seen_listings.json /tmp/penang_seen_listings.json
          cp penang_archive.json /tmp/penang_archive.json
          rm -rf /tmp/archive_images
          cp -r archive_images /tmp/archive_images
          rm -rf penang_owners.xlsx penang_seen_listings.json penang_archive.json archive_images
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin data/penang-owners-scrape; then
            git checkout -B data/penang-owners-scrape FETCH_HEAD
          else
            git checkout --orphan data/penang-owners-scrape
            git read-tree --empty
          fi
          cp /tmp/penang_owners.xlsx penang_owners.xlsx
          cp /tmp/penang_seen_listings.json penang_seen_listings.json
          cp /tmp/penang_archive.json penang_archive.json
          rm -rf archive_images
          cp -r /tmp/archive_images archive_images
          git add -f penang_owners.xlsx penang_seen_listings.json penang_archive.json archive_images
          if git diff --cached --quiet; then
            echo "Scrape output unchanged since last run - nothing to commit."
          else
            git commit -m "Scrape results ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin data/penang-owners-scrape
          fi
