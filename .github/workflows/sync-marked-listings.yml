name: Sync Marked Listings to CRM

# The other half of the CRM sync - Telegram-submitted listings already
# auto-sync via Inbox Bot; this handles hand-picked mudah listings instead.
# Tick "Mark for Marketing" TRUE on any row in the live Google Sheet's
# "Focus Area" tab, then run this to push it into the Lead Pipeline
# Airtable base. Already-synced rows are skipped (tracked via the Sheet's
# own "Synced to CRM" column, written back after each successful sync).

on:
  workflow_dispatch:
    inputs:
      airtable_base_id:
        description: "Airtable base ID"
        required: false
        default: "appwkcMDwzNN9NTuo"
  # Run shortly after the daily scrape so a mark made earlier in the day
  # gets picked up without waiting for tomorrow's run. Uncomment once
  # confirmed working via a manual test.
  # schedule:
  #   - cron: "30 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: pip install requests gspread google-auth

      - name: Write Google service-account key from secret
        working-directory: scripts/listings-pipeline
        run: echo '${{ secrets.GSHEET_SERVICE_ACCOUNT_JSON }}' > gsheet_key.json

      - name: Sync marked listings to Airtable
        working-directory: scripts/listings-pipeline
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          python mudah_crm_sync.py \
            --base-id "${{ github.event.inputs.airtable_base_id || 'appwkcMDwzNN9NTuo' }}" \
            --gsheet-id "1MVjmW28PuJruSwbt-JUrY9f51dPMC-O6lDDLfOwOpRI" \
            --gsheet-key gsheet_key.json

      - name: Remove service-account key
        if: always()
        working-directory: scripts/listings-pipeline
        run: rm -f gsheet_key.json
