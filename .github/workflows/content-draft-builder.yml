name: Content Draft Builder (Stage 1 test)

# Manual test harness for the social-content Stage 1 engine: filter the latest
# scrape to qualifying listings and download each one's real photos from mudah.
# Run this by hand first to confirm photo extraction works; once solid we chain
# it after the daily scrape.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max qualifying listings to process (0 = all)"
        required: false
        default: "3"
      new_only:
        description: "Only 'Is New Today' listings"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: |
          pip install curl_cffi pandas openpyxl pillow numpy scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Restore latest scrape from data branch
        working-directory: scripts/listings-pipeline
        run: |
          git fetch origin data/penang-owners-scrape
          git show origin/data/penang-owners-scrape:scripts/listings-pipeline/penang_owners.xlsx \
            > penang_owners.xlsx

      - name: Restore posted registry (dedup)
        working-directory: scripts/listings-pipeline
        run: |
          mkdir -p posts_input
          git fetch origin data/listing-posts || true
          git show origin/data/listing-posts:scripts/listings-pipeline/posts_input/posted_registry.json \
            > posts_input/posted_registry.json 2>/dev/null || echo "{}" > posts_input/posted_registry.json

      - name: Filter + download listing photos
        working-directory: scripts/listings-pipeline
        env:
          LIMIT: ${{ github.event.inputs.limit || '3' }}
          NEW_ONLY: ${{ github.event.inputs.new_only || 'false' }}
        run: |
          NEW_FLAG=""
          if [ "$NEW_ONLY" = "true" ]; then NEW_FLAG="--new-only"; fi
          python build_listing_posts.py \
            --input penang_owners.xlsx \
            --out posts_input \
            --registry posts_input/posted_registry.json \
            --limit "$LIMIT" \
            $NEW_FLAG

      # First real (non-synthetic) test of the multi-sample watermark
      # calibration approach - never enabled in render_creatives(), this is
      # purely diagnostic. Writes the calibrated mask/template plus a few
      # before/after previews into posts_input so they ride along in the same
      # artifact upload below for visual review. Best-effort: must not fail
      # the build if there aren't enough distinct photos to calibrate from.
      - name: Test watermark calibration against real downloaded photos
        working-directory: scripts/listings-pipeline
        continue-on-error: true
        run: |
          python watermark_calibrate.py --photos-dir posts_input --out posts_input/watermark_template.npz
          python - <<'PY'
          import glob, os, sys
          sys.path.insert(0, ".")
          import watermark_calibrate as wc

          paths = sorted(
              glob.glob("posts_input/**/photos/*.jpg", recursive=True)
              + glob.glob("posts_input/**/photos/*.jpeg", recursive=True)
              + glob.glob("posts_input/**/photos/*.png", recursive=True)
              + glob.glob("posts_input/**/photos/*.webp", recursive=True)
          )
          print(f"found {len(paths)} real downloaded photos for preview")
          if len(paths) < 8 or not os.path.exists("posts_input/watermark_template.npz"):
              print("skipping preview - not enough photos or no template")
          else:
              mask, color = wc.load_template("posts_input/watermark_template.npz")
              preview_dir = "posts_input/watermark_preview"
              os.makedirs(preview_dir, exist_ok=True)
              # Generate a few strengths side by side on the same 2 photos so we
              # can actually compare "how much fainter" instead of guessing one
              # value - user asked to reduce transparency more than the first
              # test (strength=0.6) managed to.
              for i, p in enumerate(paths[:2]):
                  for strength in (0.6, 0.8, 0.95):
                      out = os.path.join(preview_dir, f"suppressed_{i}_strength{strength}.jpg")
                      wc.suppress_watermark(p, mask, color, strength=strength, out_path=out)
                      print(f"  wrote {out} from {p}")
          PY

      - name: Upload posts_input for inspection
        uses: actions/upload-artifact@v4
        with:
          name: listing-posts-input
          path: scripts/listings-pipeline/posts_input
          retention-days: 14
