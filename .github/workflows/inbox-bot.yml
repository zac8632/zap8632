name: Inbox Bot

# Real-time ingestion via a Telegram webhook: the Cloudflare Worker under
# workers/telegram-webhook/ receives each Telegram message the instant it
# arrives and fires a repository_dispatch event here (typically starts
# within seconds - GitHub treats dispatch triggers as high-priority, unlike
# `schedule`, which was measured to run ~2 hours late on average for a
# */10 cron on this repo - a GitHub platform throttling behavior, not
# something fixable in workflow config). Extracts what it can from the free
# text, downloads photos at full original quality (no watermark - the whole
# point of this second source vs mudah), and runs them through the same
# photo_curate.py + post_content.py pipeline.
#
# getUpdates (the old polling method) and a registered webhook are MUTUALLY
# EXCLUSIVE - Telegram 409s a getUpdates call while a webhook is active. So:
#   - repository_dispatch runs ingest the ONE update the Worker forwarded
#     (--update-json), no polling.
#   - The schedule below is now just a SAFETY NET that flushes any batch
#     that's gone idle past BATCH_IDLE_SECONDS without an explicit "done"
#     message ever arriving to trigger a fresh dispatch (--no-poll - it
#     never touches Telegram's API, just checks already-buffered batches).
#     A batch finalizes INSTANTLY via the webhook path the moment someone
#     types "done", so this sweep is only for the silent-timeout case.
#   - workflow_dispatch defaults to the same flush-only behavior (safe even
#     with a live webhook); set mode=poll only if you've temporarily
#     removed the webhook (BotFather/deleteWebhook) for manual testing.
#
# Setup done: TELEGRAM_BOT_TOKEN repo secret is set, the operator's own
# chat_id is whitelisted in ALLOWED_CHAT_IDS in telegram_listings.py, the
# private agent-contact log is wired up via the TELEGRAM_LOG_GSHEET_ID repo
# variable, finalized listings sync to Airtable, and the Cloudflare Worker
# webhook is deployed and registered with Telegram (see
# workers/telegram-webhook/README.md).

on:
  repository_dispatch:
    types: [telegram-update]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch + parse only, skip photo download/rendering"
        required: false
        default: "true"
      force_flush:
        description: "Process pending batches immediately (ignore idle timer) - for testing"
        required: false
        default: "true"
      mode:
        description: "flush (safe, default - no Telegram API calls) or poll (classic getUpdates - only if the webhook is currently NOT registered)"
        required: false
        default: "flush"
      airtable_base_id:
        description: "Airtable base ID to sync finalized listings into (blank = skip Airtable sync)"
        required: false
        default: "appwkcMDwzNN9NTuo"
  schedule:
    # Safety-net idle-batch flush only (see header) - no Telegram API calls,
    # so this stays cheap even though GitHub may run it late.
    - cron: "*/10 * * * *"

# Queues overlapping runs instead of racing on data/telegram-bot-state and
# data/telegram-listing-media - two runs pushing to the same data branch at
# once would otherwise fail one of them.
concurrency:
  group: inbox-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scripts/listings-pipeline
        run: |
          pip install requests pillow numpy pandas openpyxl gspread google-auth
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Restore bot state (offset + pending batches) from data branch
        working-directory: scripts/listings-pipeline
        run: |
          mkdir -p telegram_input
          git fetch origin data/telegram-bot-state || true
          git show origin/data/telegram-bot-state:scripts/listings-pipeline/telegram_input/telegram_state.json \
            > telegram_input/telegram_state.json 2>/dev/null \
            || echo '{"last_update_id": 0, "pending": {}}' > telegram_input/telegram_state.json

      - name: Restore price-per-sqft memory from data branch (best-effort, for the caption "X% below area psf" line)
        working-directory: scripts/listings-pipeline
        run: |
          git fetch origin data/subsales-registry || true
          git show origin/data/subsales-registry:scripts/listings-pipeline/subsales_price_history.json \
            > subsales_price_history.json 2>/dev/null || echo '{}' > subsales_price_history.json

      - name: Write Google service-account key from secret (private log only)
        if: ${{ vars.TELEGRAM_LOG_GSHEET_ID != '' }}
        working-directory: scripts/listings-pipeline
        run: echo '${{ secrets.GSHEET_SERVICE_ACCOUNT_JSON }}' > gsheet_key.json

      - name: Write incoming webhook update to file (repository_dispatch only)
        if: ${{ github.event_name == 'repository_dispatch' }}
        working-directory: scripts/listings-pipeline
        env:
          # env-var indirection (not inlined into the shell command) so the
          # update's own text content can never be interpreted as shell -
          # printf '%s' with a quoted var is injection-safe regardless of
          # what's in it.
          UPDATE_JSON: ${{ toJSON(github.event.client_payload.update) }}
        run: |
          mkdir -p telegram_input
          printf '%s' "$UPDATE_JSON" > telegram_input/webhook_update.json
          python3 -c "import json; json.load(open('telegram_input/webhook_update.json'))" \
            || { echo "::error::webhook_update.json is not valid JSON - client_payload malformed"; exit 1; }

      - name: Poll Telegram and process any finalized listings
        working-directory: scripts/listings-pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_LOG_GSHEET_ID: ${{ vars.TELEGRAM_LOG_GSHEET_ID }}
          TELEGRAM_LOG_GSHEET_KEY: gsheet_key.json
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # github.event.inputs is unset on schedule-triggered runs, so the
          # old `|| 'true'` fallback would make every scheduled run a
          # perpetual dry-run/force-flush and never actually process real
          # submissions - only default to dry-run/force-flush on manual
          # workflow_dispatch testing runs.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run || 'true') || 'false' }}
          FORCE_FLUSH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.force_flush || 'true') || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'flush' }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$FORCE_FLUSH" = "true" ]; then FLAGS="$FLAGS --force-flush"; fi
          # Ingestion mode: repository_dispatch carries exactly one real
          # Telegram update from the webhook; schedule is a flush-only
          # safety net (see the workflow header - getUpdates 409-conflicts
          # with the active webhook); workflow_dispatch defaults to the same
          # safe flush-only behavior unless mode=poll is explicitly chosen
          # (only valid while the webhook is NOT registered).
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            FLAGS="$FLAGS --update-json telegram_input/webhook_update.json"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            FLAGS="$FLAGS --no-poll"
          elif [ "$DISPATCH_MODE" != "poll" ]; then
            FLAGS="$FLAGS --no-poll"
          fi
          python telegram_listings.py \
            --out telegram_input \
            --state telegram_input/telegram_state.json \
            $FLAGS

      - name: Remove service-account key before upload/commit
        if: always()
        working-directory: scripts/listings-pipeline
        run: rm -f gsheet_key.json

      - name: Upload telegram_input for inspection
        uses: actions/upload-artifact@v4
        with:
          name: telegram-listing-output
          path: scripts/listings-pipeline/telegram_input
          retention-days: 14

      # Uploads photos/creatives straight to Airtable via its content API
      # (base64, no public URL needed) - no git commit of photos required.
      # github.event.inputs is unset on schedule-triggered runs (same trap as
      # DRY_RUN above) - the old condition/base-id both read it directly, so
      # this step silently never ran on a real scheduled poll, only when
      # manually dispatched. Falls back to the known base id whenever inputs
      # aren't present (schedule) or the manual input was left blank.
      - name: Sync finalized listings to Airtable
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        working-directory: scripts/listings-pipeline
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ github.event.inputs.airtable_base_id || 'appwkcMDwzNN9NTuo' }}
        run: |
          python airtable_sync.py \
            --base-id "$AIRTABLE_BASE_ID" \
            --telegram-dir telegram_input

      - name: Commit bot state back to data branch (so the offset persists)
        working-directory: scripts/listings-pipeline
        run: |
          cp telegram_input/telegram_state.json /tmp/telegram_state.json
          rm -f telegram_input/telegram_state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin data/telegram-bot-state; then
            git checkout -B data/telegram-bot-state FETCH_HEAD
          else
            git checkout --orphan data/telegram-bot-state
            git read-tree --empty
          fi
          mkdir -p telegram_input
          cp /tmp/telegram_state.json telegram_input/telegram_state.json
          git add -f telegram_input/telegram_state.json
          if git diff --cached --quiet; then
            echo "Bot state unchanged since last run - nothing to commit."
          else
            git commit -m "Telegram bot state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin data/telegram-bot-state
          fi
